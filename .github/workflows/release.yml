name: release

# v1.2.3 のようなタグを push したときだけ動く。
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # musl の静的バイナリ (x86_64 / aarch64)。zig をリンカに使うので、どちらも同じランナーで作れる。
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release に添付するため
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: pip install ziglang cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p watchtower
      - name: package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/watchtower dist/watchtower-${{ matrix.target }}
          (cd dist && sha256sum watchtower-${{ matrix.target }} > watchtower-${{ matrix.target }}.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # distroless ベースのイメージ (amd64 / arm64)。
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io へ push するため
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
