[workspace]
resolver = "2"
members = ["crates/*", "bin/watchtower"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# 配布するバイナリを小さくする
strip = true
# panic は unwind のまま。PDF の解析や jq の評価を catch_unwind で守っているので、abort にはしない。
panic = "unwind"
