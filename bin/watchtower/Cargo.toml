[package]
name = "watchtower"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = "1.29.0"
watchtower-core = { version = "0.1.0", path = "../../crates/core" }
watchtower-fetch = { version = "0.1.0", path = "../../crates/fetch" }
watchtower-notify = { version = "0.1.0", path = "../../crates/notify" }
watchtower-process = { version = "0.1.0", path = "../../crates/process" }
watchtower-scheduler = { version = "0.1.0", path = "../../crates/scheduler" }
watchtower-store = { version = "0.1.0", path = "../../crates/store" }
watchtower-web = { version = "0.1.0", path = "../../crates/web" }

[lints]
workspace = true

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time"] }
uuid = "1.29.0"
wiremock = "0.6.5"
