[package]
name = "watchtower-notify"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
http = "1.5.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls", "aws-lc-rs", "webpki-roots"] }
minijinja = { version = "3.0.5", features = ["fuel"] }
percent-encoding = "2.3.2"
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt", "net", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
watchtower-core = { version = "0.1.0", path = "../core" }
watchtower-fetch = { version = "0.1.0", path = "../fetch" }
watchtower-metrics = { version = "0.1.0", path = "../metrics" }
watchtower-process = { version = "0.1.0", path = "../process" }
watchtower-store = { version = "0.1.0", path = "../store" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
