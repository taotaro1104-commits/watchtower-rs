[package]
name = "watchtower-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
utoipa = "6.0.0"
uuid = "1.29.0"
watchtower-core = { version = "0.1.0", path = "../core" }
watchtower-metrics = { version = "0.1.0", path = "../metrics" }
watchtower-notify = { version = "0.1.0", path = "../notify" }
watchtower-process = { version = "0.1.0", path = "../process" }
watchtower-scheduler = { version = "0.1.0", path = "../scheduler" }
watchtower-store = { version = "0.1.0", path = "../store" }

[lints]
workspace = true

[dev-dependencies]
http = "1.5.0"
http-body-util = "0.1.5"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower = "0.5.3"
uuid = "1.29.0"
