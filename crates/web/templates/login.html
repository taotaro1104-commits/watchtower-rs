{% extends "base.html" %}
{% block title %}Sign in - watchtower{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if let Some(e) = error %}<p class="error" role="alert">{{ e }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
